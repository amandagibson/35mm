<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Skin_ | A. GIBSON</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html">A. GIBSON</a>
      <div class="brand">35mm</div>
      <nav class="nav">
        <a class="about-link" href="/about.html">About</a>
      </nav>
    </header>

    <main class="image-gallery image-gallery--collection">
      <h1 class="collection-name">Skin_</h1>

      <div class="gallery-container">
        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/skin/tables.jpg"
            alt="Tables with food and wine in a restaurant"
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">Kodak Portra 400 | Nikon L35AF</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/skin/curtain-call.jpg"
            alt="Two women with their backs to us in front of a curtain of party streamers"
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">Kodak Portra 400 | Nikon L35AF</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/skin/pour.jpg"
            alt="Wine bottles and glasses on a table"
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">CineStill 800T | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/skin/four-hands.jpeg"
            alt="An overhead shot of two women playing piano"
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">Silbersalz Cinefilm 500T | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/skin/ulfs-studio.jpg"
            alt="Two men, one playing guitar and the other behind him playing piano"
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">Kodak Portra 400 | Nikon L35AF</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/skin/wired.jpg"
            alt="A woman in a sparkly top djing and dancing"
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">Kodak Portra 400 | Nikon L35AF</p>
          </div>
        </figure>

    <footer class="site-footer">
