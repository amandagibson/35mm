<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Concrete_ | A. GIBSON</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html">A. GIBSON</a>
      <div class="brand">35mm</div>
      <nav class="nav">
        <a class="about-link" href="/about.html">About</a>
      </nav>
    </header>

    <main class="image-gallery image-gallery--collection">
      <h1 class="collection-name">Concrete_</h1>
      <div class="gallery-container">
        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/concrete/overwritten.JPG"
            alt="Graffiti on a building facade in Berlin"
          />
          <div class="image-caption">
            <p class="location">Berlin</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image collection-image--landscape"
            src="/images/concrete/fernsehturm.JPG"
            alt="Fernsehturm tower in Berlin"
          />
          <div class="image-caption">
            <p class="location">Berlin</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image collection-image--landscape"
            src="/images/concrete/repetition.JPG"
            alt="A view of a building with repeating windows in Berlin"
          />
          <div class="image-caption">
            <p class="location">Berlin</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/concrete/kosmos.JPG"
            alt="The Kosmos building facade in Berlin"
          />
          <div class="image-caption">
            <p class="location">Berlin</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image collection-image--landscape"
            src="/images/concrete/spire.JPG"
            alt="A church spire in Stockholm with barren trees in the foreground"
          />
          <div class="image-caption">
            <p class="location">Stockholm</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/concrete/carved.JPG"
            alt="The statue garden inside Stockholms Nationalmuseum"
          />
          <div class="image-caption">
            <p class="location">Stockholm</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Amanda Gibson</p>
      </div>
    </footer>
  </body>
</html>
