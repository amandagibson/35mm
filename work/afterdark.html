<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Afterdark_ | A. GIBSON</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/index.html">A. GIBSON</a>
      <div class="brand">35mm</div>
      <nav class="nav">
        <a class="about-link" href="/about.html">About</a>
      </nav>
    </header>

    <main class="image-gallery image-gallery--collection">
      <h1 class="collection-name">Afterdark_</h1>

      <div class="gallery-container">
        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/afterdark/within-cells-interlinked.JPG"
            alt="The silhouette of a person illuminated by a red light in a dark room"
          />
          <div class="image-caption">
            <p class="location">Stockholm</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image collection-image--landscape"
            src="/images/afterdark/passage.JPG"
            alt="A person walking through a passageway with their back to you"
          />
          <div class="image-caption">
            <p class="location">Stockholm</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/afterdark/ascent.JPG"
            alt="The back of a persons pants and shoes on an escalator"
          />
          <div class="image-caption">
            <p class="location">Stockholm</p>
            <Kodak class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/afterdark/koskenkorva.JPG"
            alt="Sillouettes illuminated in a dark room by a blue Koskenkorva sign"
          />
          <div class="image-caption">
            <p class="location">Stockholm</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image collection-image--landscape"
            src="/images/afterdark/propavan.JPG"
            alt="An empty, dark, city street illuminated by a parking garage sign and streetlights"
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">Kodak Portra 400 | Olympus Trip 35</p>
          </div>
        </figure>

        <figure class="collection-photo">
          <img
            class="collection-image"
            src="/images/afterdark/between-hours.jpg"
            alt="The blurry lights of a city skyline behind a chainlink fence."
          />
          <div class="image-caption">
            <p class="location">Södermalm</p>
            <p class="details">Kodak Portra 400 | Olympus OM-1</p>
          </div>
        </figure>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Amanda Gibson</p>
      </div>
